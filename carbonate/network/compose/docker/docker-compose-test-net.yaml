services:
  peer0.platform.carbonate.local:
    container_name: carbonate-lp-platform
    image: npcioss/drunix-peer:1.0.0
    labels:
      service: carbonate
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=carbonate_pilot
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
  peer1.platform.carbonate.local:
